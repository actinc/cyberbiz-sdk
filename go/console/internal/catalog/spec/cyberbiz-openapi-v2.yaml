            - preparing
            - cancel
            - fulfilled
            - partial
            - arrived
            - received
            - returned
            - expired
            - problem
            - no_need
        return_status:
          description: 'Return status: `no_need`, `request_return`, `returning`, `checking`, `returned`, `in_hub`, `problem`, `processing`, `in_origin_cvs`, `refused`, `partial_return`.'
          type: string
          enum:
