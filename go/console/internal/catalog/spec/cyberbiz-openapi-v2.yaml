            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        note:
          description: Note.
          type:
            - string
            - "null"
        custom_fields:
          description: Only present when `include_params` requests it.
          type: array
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Created at.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Updated at.
        confirmed_at:
          description: Confirmed at.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        mobile_sms_confirmed_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        bonus_remain:
