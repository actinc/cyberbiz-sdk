            - S105
        size:
          description: 'Package size: `60` / `90` / `105` for T-cat quick store delivery; `60` / `90` / `120` / `150` for home delivery.'
          type: integer
          enum:
            - 60
            - 90
            - 105
    CvsShippingLabelsRequest:
      type: object
