        name:
          description: Name.
          type: string
        status:
          description: Status.
          type: string
        email:
          description: E-mail address.
          type: string
        country_calling_code:
          type:
            - string
            - "null"
        mobile:
          type:
            - string
            - "null"
        enable_cvs_pickup:
          type: boolean
        enable_cvs_cod:
          type: boolean
        enable_home_delivery_cod:
          type:
            - boolean
            - "null"
        accepts_marketing:
          type: boolean
        accepts_email_notification:
          description: Only present when `include_params` requests it.
          type: boolean
        tags:
          description: Tag filter. Only present when `include_params` requests it.
