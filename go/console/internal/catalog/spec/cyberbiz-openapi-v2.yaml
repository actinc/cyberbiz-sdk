          enum:
            - paid
            - pending
            - cod
            - failed
            - abandoned
            - refunded
            - no_refunded
            - pending_refund
            - processing
            - remitted
            - pending_partial_refund
            - partial_refunded
            - refunding
            - refund_failed
        fulfillment_status:
          description: 'Shipping status: `unshipped`, `preparing`, `cancel`, `fulfilled` (shipped), `partial`, `arrived` (at store), `received`, `returned`, `expired` (not picked up), `problem`, `no_need`.'
