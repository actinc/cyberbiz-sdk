          type: string
        fulfilled_at:
          $ref: '#/components/schemas/Timestamp'
          description: Shipped at.
        received_at:
          description: Received at.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        status:
          description: Status.
          type: string
        line_items:
          description: Ordered items.
          type: array
          items:
            $ref: '#/components/schemas/LineItemV2'
    CvsShippingCreate:
      type: object
