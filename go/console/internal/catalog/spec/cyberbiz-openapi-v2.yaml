        address:
          type: string
        detail_address:
          type: object
          properties:
            zip:
              type: string
            country:
              type:
                - string
                - "null"
            province:
              type:
                - string
                - "null"
            city:
              type: string
            district:
              type: string
            address1:
              type: string
            address2:
              type:
                - string
                - "null"
    CustomerOAuthRequest:
      type: object
      properties:
        uid:
          description: The affiliate user id (`uid` query parameter of the storefront visit).
          type: string
