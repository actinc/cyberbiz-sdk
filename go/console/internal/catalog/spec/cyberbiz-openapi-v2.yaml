          type: boolean
        items:
          description: Child items (recursive).
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
    MenuItem:
      type: object
      properties:
        id:
          description: Id.
          type: integer
        title:
          description: Title.
          type: string
        subject_handle:
          description: Handle of the linked subject (product, page, collection), when any.
          type:
            - string
            - "null"
        url:
          description: Link URL.
          type: string
        position:
          description: Position (1-based).
          type: integer
        subtitle:
          description: Subtitle.
          type:
            - string
            - "null"
        icon_image_url:
          description: Icon image URL.
          type:
            - string
            - "null"
        item_type:
          description: 'Item type; values seen: `frontpage`, `collections_all`, `http`, `product`, `contact`, `page`.'
          type: string
        level:
          description: Nesting level (1 = top).
          type: integer
        items:
          description: Child items (recursive).
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        end_at:
          description: Only null was observed; the type is unknown.
          x-cyberbiz-observed: true
        start_at:
          description: Observed in live responses; not in the CYBERBIZ swagger.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
          x-cyberbiz-observed: true
    MenuSummary:
      type: object
      properties:
        id:
          description: Id.
          type: integer
        title:
          description: Title.
          type: string
        system_default:
          description: Whether the menu is a system default menu.
          type: boolean
    Money:
      description: A currency amount in the shop's currency (TWD) serialised as a JSON number, usually with one decimal (`9999.0`). Integers appear for some fields; treat every money field as a decimal.
      type: number
      examples:
        - 9999
    OrderBuyer:
      type: object
      properties:
        email:
          description: E-mail address.
          type: string
        mobile:
          type: string
    OrderPrices:
      type: object
      properties:
        total_line_items_price:
          $ref: '#/components/schemas/Money'
