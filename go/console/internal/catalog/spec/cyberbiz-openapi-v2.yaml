        position:
          description: Position (1-based).
          type: integer
        id:
          description: Id.
          type: integer
    CustomerAddressV2:
      type: object
      properties:
        company:
          type:
            - string
            - "null"
        country_calling_code:
          type:
            - string
            - "null"
        phone:
