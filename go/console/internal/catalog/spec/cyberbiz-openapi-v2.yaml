    Date:
      description: A calendar date written as `YYYY-MM-DD`.
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      examples:
        - "1990-01-01"
    Error:
      description: 'The error envelope. CYBERBIZ uses four shapes: `{"error": ["..."]}`, `{"error": "..."}`, `{"message": "..."}` and `{"messages": "..."}`; messages are in Traditional Chinese or English.'
      type: object
      properties:
        error:
          description: One or more error messages.
          anyOf:
            - type: array
              items:
                type: string
            - type: string
        message:
          description: A single error message (422 on some endpoints).
          type: string
        messages:
          description: A single error message (403 on some endpoints).
          type: string
    InventoryBatchUpdate:
      type: object
      required:
        - store_number
        - items
