        shipping_rate_price:
          $ref: '#/components/schemas/Money'
          description: Shipping fee.
        discounts:
          description: Itemised discounts.
          type: object
          properties:
            special_collection_discount:
              $ref: '#/components/schemas/Money'
              description: Special collection (campaign) discount.
            vip_discount:
              $ref: '#/components/schemas/Money'
              description: VIP discount.
            shop_discount:
              description: Shop-wide discount detail.
              anyOf:
                - $ref: '#/components/schemas/Money'
                - type: "null"
            coupon_discount:
              description: Coupon detail (single, deprecated).
              anyOf:
                - $ref: '#/components/schemas/Money'
                - type: "null"
            coupon_discounts:
              description: Coupon details.
              type: array
              items:
                $ref: '#/components/schemas/Money'
            bonus_consumed:
              $ref: '#/components/schemas/Money'
              description: Bonus points spent.
            vip_shipping_discount:
              $ref: '#/components/schemas/Money'
              description: VIP shipping discount.
            coupon_shipping_discount:
              $ref: '#/components/schemas/Money'
              description: Free-shipping coupon discount.
            price_discount:
              $ref: '#/components/schemas/Money'
              description: Manual (store manager) discount.
        total_price:
          $ref: '#/components/schemas/Money'
          description: Order total.
    OrderStatuses:
      type: object
      properties:
        order_status:
          description: 'Order status: `open` (in progress), `closed` (completed), `cancelled`.'
          type: string
          enum:
            - open
            - closed
            - cancelled
        financial_status:
          description: 'Payment status: `paid`, `pending` (awaiting payment), `cod` (cash on delivery), `failed`, `abandoned`, `refunded`, `no_refunded`, `pending_refund`, `processing` (customer service), `remitted` (transfer reported, not received), `pending_partial_refund`, `partial_refunded`, `refunding`, `refund_failed`. The filter pseudo-values `except_abandoned_order` and `all_financial_status` are query helpers, not states.'
