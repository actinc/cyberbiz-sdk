openapi: 3.1.0
info:
  title: CYBERBIZ API v2 and app endpoints
  version: 1.0.1
  description: |-
    # CYBERBIZ API v2 and app endpoints

    The `/v2` operations and the unprefixed app endpoints (`/shop`, `/settings`) of the CYBERBIZ
    e-commerce platform. There is no machine-readable v2 specification; this document is transcribed
    from the CYBERBIZ Notion reference and corrected against recorded live responses (Golden Files).
    v1 and v2 share the host, the token and the conventions below; v2 is not a replacement for v1
    (orders, products and customers CRUD remain on v1).

    ## Conventions

    - **Base URL**: `https://app-store-api.cyberbiz.io` for every shop and every API version. Versions are path prefixes (`/v1`, `/v2`); the app endpoints `/shop` and `/settings` have no prefix.
    - **Authentication**: `Authorization: Bearer <API Token>` on every request. The token is a JWT issued to the app for one Shop and carries its scopes (`read_orders`, `write_products`, ...). `read_*` scopes grant the GET operations of a resource group; `write_*` scopes grant POST/PUT/DELETE.
    - **Rate limit**: at most 5 requests per second per token. Expect `429` beyond that.
    - **Pagination**: list endpoints take `page` (1-based), `per_page` (default and maximum 50) and `offset`; the returned slice starts at record `offset + (page - 1) * per_page + 1`. The response carries `X-Page`, `X-Per-Page`, `X-Offset`, `X-Total`, `X-Total-Pages`, `X-Next-Page` and `X-Prev-Page`.
    - **Timestamps** are local Asia/Taipei strings `YYYY-MM-DD HH:MM:SS` without a zone (schema `Timestamp`); dates are `YYYY-MM-DD` (schema `Date`).
    - **Money** fields are JSON numbers (floats such as `9999.0`) even where the swagger says integer (schema `Money`).
    - **Nullability**: no field is guaranteed non-null. Fields observed as `null` in live responses are marked nullable; treat any other field as possibly null too.
    - **Request bodies** are sent as JSON. The original swagger documents most writes as form data; the platform accepts `application/json`.
    - **Errors** use one of `{"error": ["..."]}`, `{"error": "..."}`, `{"message": "..."}`, `{"messages": "..."}`. `401` means the token is invalid **or** the feature is not licensed for the shop. Some lookups answer `200` with a bare `null` or `206` with `[]` when nothing matches.
    - **Samples** in this document are synthetic: their shape comes from recorded responses, their values are fake.

    ## Release Notes

    ### 1.0.1 (2026-10-02)

    - Postman collection descriptions no longer point to repository-internal files.

    ### 1.0.0 (2026-09-08)

    - Initial generation from the CYBERBIZ v1 swagger, the v1/v2 Postman collections, the Notion v2 reference and the webhook reference.
    - Observed corrections applied: nullable fields, money as float, order_number as integer, arrays documented as objects, fields missing from the swagger, Bearer authentication.
    - Synthetic samples derived from the Golden Files for every operation and event.
servers:
  - url: https://app-store-api.cyberbiz.io
    description: Production (the same host for every shop and every API version).
security:
  - bearerAuth: []
tags:
  - name: app
    description: 'App-level endpoints without a version prefix: the shop and the app''s settings on that shop.'
  - name: product_feeds
    description: Product feed URLs for advertising platforms.
  - name: affiliates
    description: Affiliate (revenue-share) vendor orders.
  - name: pages
    description: Custom storefront pages with an HTML section.
  - name: shipping
    description: Convenience-store and home-delivery shipping labels.
  - name: menus
    description: Storefront menus (link lists).
  - name: categories
    description: Multi-level product categories.
  - name: collections
    description: Custom and smart collections (v2 search endpoints).
  - name: customer_oauth
    description: Customer OAuth.
  - name: customers
    description: 'Customers: profile, tags, custom fields, bonus points, coupons, orders, VIP information.'
  - name: shop_emails
    description: Shop e-mail address and subscribers.
  - name: products
    description: Products, variants, options, photos, descriptions, tags and bind-shipping settings.
  - name: pos_wallets
    description: POS stored-value wallets (requires the POS stored-value feature).
paths:
  /settings:
    get:
      tags:
        - app
      summary: Get the app's settings on this shop
      description: 'The app installation (`shop_add_on`) on this shop: its setting values, vendor type, token, validity window and the installed app version with its manifest and granted scopes.'
      operationId: getSettings
      responses:
        "200":
          description: The app installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopAddOnEnvelope'
              example:
                shop_add_on:
                  id: 1
                  settings: {}
                  vendor_type: example-app
                  token: synthetic-token-do-not-use
                  start_at: null
                  end_at: null
                  add_on_version:
                    webhook_url: https://example.com/webhooks/cyberbiz
                    manifest:
                      name: Example App
                      version: 0.1.0
                      scopes: public
                      manifest_version: 1
                      type: other
                      webhook_events:
                        - customers/create
                        - customers/update
                        - uid_providers/create
                        - uid_providers/update
                        - customer_tags/update
                        - bonus_points/create
                        - bonus_points/update
                        - bonus_points/destroy
                        - comment_bonus/create
                        - orders/opened
                        - orders/create
                        - orders/paid
                        - orders/preparing
                        - orders/fulfilled
                        - orders/received
                        - orders/arrived
                        - orders/expired
                        - orders/cancelled
                        - orders/returned
                        - orders/partial_return
                        - orders/refunded
                        - orders/partial_refunded
                        - orders/closed
                        - orders/request_return
                        - affiliate_vendor_orders/create
                        - affiliate_vendor_orders/closed
                        - affiliate_vendor_orders/cancelled
                        - orders/update
                        - products/create
                        - products/update
                        - products/delete
                        - products/update_photos
                        - products/update_options
                        - variants/create
                        - variants/update
                        - variants/delete
                        - cart/add
                        - domains/create
                        - domains/update
                        - domains/destroy
                        - collections/create
                        - collections/delete
                        - collections/update
                        - apps/uninstall
                        - express_delivery_orders/update
                        - bulk_operations/finish
                        - coupons/create
                        - coupons/update
                        - coupons/destroy
                        - customer_vip_level/update
                        - menus/create
                        - menus/update
                        - menus/destroy
                    embedded: true
                    status: init
                    scopes: public read_products write_products read_customers write_customers read_orders write_orders read_affiliates read_discounts write_discounts read_pos write_pos read_branch_stores write_branch_stores read_edms customer_notifications write_content read_content customer_oauth read_shop_points consume_shop_points read_eticket write_eticket refill_shop_points read_shop_emails pim read_shop_users
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - app
      summary: Update the app's settings on this shop
      description: Updates the values of the `setting_fields` declared in the app manifest. Each `field` must equal a field name declared at application time.
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopAddOnSettingsUpdate'
            example:
              settings:
                - field: your_field_name
                  data: value
      responses:
        "200":
          description: The updated app installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopAddOnUpdatedEnvelope'
              example:
                shop_add_on:
                  id: 1
                  settings:
                    your_field_name: value
                  vendor_type: example-app
                  token: synthetic-token-do-not-use
                  start_at: null
                  end_at: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /shop:
    get:
      tags:
        - app
      summary: Get the shop
      description: 'The shop the token belongs to: primary domain, name, id, contact e-mail, Open Graph image and LINE settings.'
      operationId: getShop
      responses:
        "200":
          description: The shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopInfoEnvelope'
              example:
                shop_info:
                  primary_domain: example.cyberbiz.co
                  name: 王小明
                  id: 1
                  email: customer@example.com
                  og_image_url: //example.cyberbiz.co/media/sample-product.jpg
                  shop_line_chat_bot: null
                  shop_line:
                    login_enable: true
                    liff_id: null
                    liff_enable: false
                  language: zh-TW
                  currency: TWD
                  sms_prefix: 【CYBERBIZ代發】
                  merchant_location: Taiwan
                  market_location: Taiwan
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/affiliate_vendor_orders:
    get:
      tags:
        - affiliates
      summary: List affiliate vendor orders
      description: |-
        Orders attributed to the affiliate (revenue-share) vendor. Child orders of a periodic order created with the affiliate query parameters (`affiliate`, `cid`, `uid`) are included. The Notion reference shows an `affiliate_vendor_orders` envelope; the live API answers a bare array (Golden File), which is what this document describes.

        Scope: `read_affiliates`.
      operationId: getV2AffiliateVendorOrders
      parameters:
        - name: start_time
          in: query
          description: Order creation start (`YYYY-MM-DD hh:mm:ss`, Asia/Taipei)
          schema:
            type: string
          example: "2026-09-01 00:00:00"
        - name: end_time
          in: query
          description: Order creation end (`YYYY-MM-DD hh:mm:ss`, Asia/Taipei)
          schema:
            type: string
          example: "2026-09-30 23:59:59"
        - name: closed_at_start_time
          in: query
          description: Order `closed_at` start (`YYYY-MM-DD hh:mm:ss`, Asia/Taipei)
          schema:
            type: string
          example: "2026-09-01 00:00:00"
        - name: closed_at_end_time
          in: query
          description: Order `closed_at` end (`YYYY-MM-DD hh:mm:ss`, Asia/Taipei)
          schema:
            type: string
          example: "2026-09-30 23:59:59"
        - name: statuses
          in: query
          description: 'Order statuses, comma-separated: `open`, `closed`, `cancelled`.'
          schema:
            type: string
          example: open,closed
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: The affiliate orders.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateVendorOrder'
              example:
                - status_code: create_succeed
                  uid: U0000000000000000000000000000001
                  cid: 0123456789abcdef0123456789abcdef
                  vendor_name: example-vendor
                  order:
                    customer_id: 1
                    subtotal_price: 300.0
                    created_at: "2026-09-01 10:00:00"
                    updated_at: "2026-09-01 10:00:00"
                    order_number: 1001
                    order_name: '#1001'
                    buyer:
                      email: customer@example.com
                      mobile: "0912345678"
                    line_items:
                      - id: 2
                        product_id: 3
                        product_variant_id: 4
                        title: 範例商品
                        variant_title: ""
                        sku: SKU-001
                        qc: null
                        vendor: null
                        price: 300.0
                        cost: null
                        quantity: 1
                        item_type: normal
                        discount_name: ""
                        discounts: []
                        total_price_before_discounts: 300.0
                        total_discount: 0.0
                        total_price_after_discounts: 300.0
                        tax_type_id: inclusive_tax
                        bonus_redemption_price: null
                        related_items: []
                        created_at: "2026-09-01 10:00:00"
                    shipping_type: cyberbiz
                    shipping_name: 自取
                    delivery_date: null
                    delivery_time: 0
                    delegate: null
                    prices:
                      total_line_items_price: 300.0
                      shipping_rate_price: 10.0
                      discounts:
                        special_collection_discount: 0.0
                        vip_discount: 0.0
                        shop_discount: null
                        coupon_discount: null
                        coupon_discounts: []
                        bonus_consumed: 0.0
                        vip_shipping_discount: 0.0
                        coupon_shipping_discount: 0.0
                        price_discount: 0.0
                      total_price: 310.0
                    transaction_number: null
                    merchant_trade_no: S1#1001
                    statuses:
                      order_status: open
                      financial_status: pending
                      fulfillment_status: unshipped
                      return_status: no_need
                    timings:
                      request_return_at: null
                      return_at: null
                      refund_at: null
                      closed_at: null
                      cancelled_at: null
                      expired_at: null
                      confirmed_at: "2026-09-01 10:00:00"
                    return_histories: []
                    note: ""
                    total_bonus_redemption_price: 0.0
                    linked_order_info:
                      source: 非導購訂單
                    shipping_status: null
                    extra_info: null
                    from_device: 桌機
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/categories:
    get:
      tags:
        - categories
      summary: List categories
      description: |-
        Multi-level product categories. `full_handle` encodes the hierarchy (`clothing/mens/shirts`) and builds the storefront URL `https://<domain>/categories/<full_handle>`; `handle` is the category's own segment.

        Scope: `read_products`.
      operationId: getV2Categories
      parameters:
        - name: q
          in: query
          description: Category title to search (string match).
          schema:
            type: string
          example: 服飾
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: The categories.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - title: 範例群組
                  handle: ecoupon
                  full_handle: ecoupon
                  id: 1
                - title: 範例群組
                  handle: entea
                  full_handle: entea
                  id: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/custom_collections:
    get:
      tags:
        - collections
      summary: Search custom collections
      description: |-
        Custom collections, searchable by title or handle. `products_order_name` carries the display label of the ordering (e.g. `按標題拼音升序: A-Z`), not the code; codes are `title.asc`, `title.desc`, `created_at.desc`, `created_at.asc`, `price.desc`, `price.asc`, `manual`, `sell_weight.desc`.

        Scope: `read_products`.
      operationId: getV2CustomCollections
      parameters:
        - name: q
          in: query
          description: Title or handle to search (string match).
          schema:
            type: string
          example: 首頁
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: The collections.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomCollectionV2'
              example:
                - title: 範例群組
                  handle: 英茶香
                  published: true
                  body_html: null
                  products_order_name: '按標題拼音升序: A-Z'
                  position: 2
                  id: 1
                - title: 範例群組
                  handle: 所有商品
                  published: true
                  body_html: null
                  products_order_name: '按標題拼音升序: A-Z'
                  position: 1
                  id: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/customer_oauth:
    post:
      tags:
        - customer_oauth
      summary: Customer OAuth
      description: |-
        Documentation defect: the Notion section for this endpoint is a verbatim copy of `GET /v2/categories`, so no request/response contract is published. The request body below comes from the CYBERBIZ Postman collection; the response is undocumented. Consult CYBERBIZ support before relying on it.

        Scope: `customer_oauth`.
      operationId: postV2CustomerOauth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOAuthRequest'
            example:
              uid: U0000000000000000000000000000001
              provider: line
      responses:
        "200":
          description: Undocumented.
          content:
            application/json:
              schema:
                description: Undocumented response body.
              example: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/customers:
    get:
      tags:
        - customers
      summary: List customers
      description: |-
        Customers as a bare array. The live API returns the compact shape shown in the sample; `include_params` adds optional sections (`vip_info` is documented; the Postman collection also sends `uid_providers,tags`). When `ids` is given pagination is disabled.

        Scope: `read_customers`.
      operationId: getV2Customers
      parameters:
        - name: ids
          in: query
          description: Comma-separated customer ids (at most 100). Disables pagination.
          schema:
            type: string
          example: 1,2,3
        - name: include_params
          in: query
          description: 'Extra sections to include, comma-separated. Documented: `vip_info`.'
          schema:
            type: string
          example: vip_info
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: The customers.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerV2'
              example:
                - id: 1
                  name: 王小明
                  status: enabled
                  email: customer@example.com
                  country_calling_code: null
                  mobile: "0912345678"
                  enable_cvs_pickup: true
                  enable_cvs_cod: true
                  enable_home_delivery_cod: null
                  accepts_marketing: true
                  gender: female
                  birthday: null
                  other_accumulated_consumption: 0
                  other_accumulated_consumption_expired_at: null
                  note: null
                  created_at: "2023-10-03 12:04:02"
                  updated_at: "2026-03-26 18:30:18"
                  confirmed_at: "2023-11-30 22:30:58"
                  mobile_sms_confirmed_at: "2023-11-30 22:30:58"
                - id: 2
                  name: 王小明
                  status: enabled
                  email: customer@example.com
                  country_calling_code: null
                  mobile: "0912345678"
                  enable_cvs_pickup: true
                  enable_cvs_cod: true
                  enable_home_delivery_cod: null
                  accepts_marketing: true
                  gender: 男
                  birthday: null
                  other_accumulated_consumption: 0
                  other_accumulated_consumption_expired_at: null
                  note: null
                  created_at: "2023-11-22 16:49:25"
                  updated_at: "2023-11-22 16:49:25"
                  confirmed_at: "2023-11-22 16:49:25"
                  mobile_sms_confirmed_at: "2023-11-22 16:49:25"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/customers/by_uid_provider:
    get:
      tags:
        - customers
      summary: Get a customer by social-login uid
      description: |-
        Looks up one customer by the uid of a social-login provider. Answers `null` when no customer matches (Golden File). The parameters are `uid` and `provider` (verified against the live API); the Notion reference's `provider_type` is a documentation error.

        Scope: `read_customers`.
      operationId: getV2CustomersByUidProvider
      parameters:
        - name: uid
          in: query
          description: The provider's user id.
          schema:
            type: string
          example: U0000000000000000000000000000001
        - name: provider
          in: query
          description: 'Provider: `line`, `line_at`, `facebook`, ...'
          schema:
            type: string
          example: line
      responses:
        "200":
          description: The customer, or `null` when not found. Answers `null` when the resource does not exist.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/CustomerV2'
                  - type: "null"
              example: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/menus:
    get:
      tags:
        - menus
      summary: List menus
      description: |-
        All menus (link lists) of the storefront. The Notion sample is not valid JSON; the live API answers a bare array (Golden File).

        Scope: `read_content`.
      operationId: getV2Menus
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: The menus.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
