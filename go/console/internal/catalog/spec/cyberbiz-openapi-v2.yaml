  /v2/products/batch_update_branch_store_inventory:
    put:
      tags:
        - products
      summary: Batch-update branch-store inventory
      description: |-
        Queues an asynchronous job that sets branch-store inventory by store number and SKU; at most 1000 items per call. Requires the 'batch update branch store inventory by store number and sku' plugin (otherwise `422`). Poll the job with `GET /v2/products/branch_store_inventory_update_status`.

        Scope: `write_products`.
      operationId: putV2ProductsBatchUpdateBranchStoreInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryBatchUpdate'
            example:
              store_number: S001
              items:
                - sku: SKU-001
                  inventory_quantity: 10
                - sku: SKU-002
                  inventory_quantity: 5
      responses:
        "202":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryJobQueued'
              example:
                job_id: 5f1a2b3c4d5e6f7a8b9c0d1e
                status: QUEUED
                message: Inventory update job has been queued
                store_number: S001
                total_items: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/products/branch_store_inventory_update_status:
    get:
      tags:
        - products
      summary: Poll a batch inventory job
      description: |-
        Status of a job created by `PUT /v2/products/batch_update_branch_store_inventory`. `status` is `QUEUE` (poll) / `QUEUED` (create), `PROCESSING`, `SUCCESS` or `FAILED`; an unknown job answers `{"error": ["job_id '...' 不存在"]}`. Timestamps here carry a `+0800` suffix.

        Scope: `read_products`.
      operationId: getV2ProductsBranchStoreInventoryUpdateStatus
      parameters:
        - name: job_id
          in: query
          description: Job id from the batch update response.
          required: true
          schema:
            type: string
          example: 5f1a2b3c4d5e6f7a8b9c0d1e
      responses:
        "200":
          description: The job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryJobStatus'
              example:
                job_id: 5f1a2b3c4d5e6f7a8b9c0d1e
                status: SUCCESS
                message: Inventory update completed successfully
                created_at: 2026-09-01 10:00:00 +0800
                completed_at: 2026-09-01 10:00:17 +0800
                result:
                  total: 2
                  succeeded: 1
                  failed: 1
                  failed_items:
                    - sku: SKU-001
                      error: sku not found
                error: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: 'Validation failed, or the feature is not enabled for the shop. The body is `{"error": [...]}` or `{"message": "..."}`. (message recorded for this endpoint)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  - 無「利用店號和 sku 批量更新門市庫存」功能，請聯絡您的開店顧問
        "429":
          $ref: '#/components/responses/TooManyRequests'
