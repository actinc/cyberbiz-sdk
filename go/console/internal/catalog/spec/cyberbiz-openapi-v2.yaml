            - QUEUED
            - PROCESSING
            - SUCCESS
            - FAILED
        message:
          description: Message.
          type: string
        created_at:
          description: Created at. Format `YYYY-MM-DD HH:MM:SS +0800`.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        completed_at:
          description: Completion time, `YYYY-MM-DD HH:MM:SS +0800`.
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: "null"
        result:
          description: Job result once finished.
          type:
            - object
            - "null"
          properties:
            total:
              $ref: '#/components/schemas/Money'
              description: Items processed.
            succeeded:
              description: Items updated.
              type: integer
            failed:
              description: Items that failed.
              type: integer
            failed_items:
              description: Failed items with the reason.
              type: array
              items:
                type: object
                properties:
                  sku:
                    description: SKU.
                    type: string
                  error:
                    description: Error.
                    type: string
        error:
          description: Failure reason when `status` is `FAILED`.
          type:
            - string
            - "null"
    LineItemV2:
