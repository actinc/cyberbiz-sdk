      summary: Search smart collections
      description: |-
        Smart (rule-based) collections with their rules and matching products, searchable by title or handle.

        Scope: `read_products`.
      operationId: getV2SmartCollections
      parameters:
        - name: q
          in: query
          description: Title or handle to search.
          schema:
            type: string
          example: 千元
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: The collections.
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SmartCollectionV2'
              example:
                - title: 範例群組
                  handle: within_a_thousand
                  published: true
                  body_html: null
                  position: 1
                  rules:
                    - id: 1
                      filter: 商品價格 小於 1000
                  products:
                    - id: 1
                      title: 範例標題
                      position: 1
                    - id: 2
                      title: 範例標題
                      position: 2
                  id: 1
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'The Shop''s API Token, sent as `Authorization: Bearer <token>`. One token authorises one Shop and carries the scopes the app was granted.'
  parameters:
    page:
      name: page
      in: query
      description: Page number, 1-based.
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1
    per_page:
      name: per_page
      in: query
      description: Records per page; default and maximum 50.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 50
      example: 50
    offset:
      name: offset
      in: query
      description: Records to skip before paging. The first returned record is `offset + (page - 1) * per_page + 1`.
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0
  headers:
    X-Page:
      description: The page that was returned (echoes `page`).
      schema:
        type: string
      example: "1"
    X-Per-Page:
      description: Records per page (echoes `per_page`).
      schema:
        type: string
      example: "50"
    X-Offset:
      description: Records skipped before paging (echoes `offset`).
      schema:
        type: string
      example: ""
    X-Total:
      description: Total number of records matching the query, regardless of paging.
      schema:
        type: string
      example: "92"
    X-Total-Pages:
      description: 'Total pages: CEILING((X-Total - X-Offset) / X-Per-Page).'
      schema:
        type: string
      example: "2"
    X-Next-Page:
      description: Number of the next page; at most X-Total-Pages. Empty on the last page.
      schema:
        type: string
      example: "2"
    X-Prev-Page:
      description: Number of the previous page; empty on the first page.
      schema:
        type: string
      example: ""
  responses:
    Unauthorized:
      description: The token is missing, invalid, expired, lacks the scope, or the feature is not licensed for this shop (CYBERBIZ answers 401 for both).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              $ref: '#/components/examples/unauthorized'
    Forbidden:
      description: 'The action is not allowed in the resource''s current state, or a required plugin is missing. The body is `{"error": "..."}` or `{"messages": "..."}`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              $ref: '#/components/examples/forbidden'
    NotFound:
      description: The resource does not exist. Note that some lookups answer `200` with a `null` body or `206` with `[]` instead of `404`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/notFound'
    UnprocessableEntity:
      description: 'Validation failed, or the feature is not enabled for the shop. The body is `{"error": [...]}` or `{"message": "..."}`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unprocessableEntity:
              $ref: '#/components/examples/unprocessableEntity'
    TooManyRequests:
      description: More than 5 requests per second were sent. Back off and retry; the body shape is not documented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooManyRequests:
              $ref: '#/components/examples/tooManyRequests'
  examples:
    unauthorized:
      summary: Unauthorized
      value:
        error:
          - 無權使用該 API
    forbidden:
      summary: Forbidden
      value:
        error: Must have pos_shop_coupon plugin
    notFound:
      summary: NotFound
      value:
        error:
          - 無此資源
    unprocessableEntity:
      summary: UnprocessableEntity
      value:
        error:
          - custom_field_type 無效值
    tooManyRequests:
      summary: TooManyRequests
      value:
        error:
          - Rate limit exceeded
  schemas:
    AffiliateOrder:
      type: object
      properties:
        customer_id:
          description: Customer id.
          type: integer
        subtotal_price:
          $ref: '#/components/schemas/Money'
          description: Subtotal before shipping.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Created at.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Updated at.
        order_number:
          description: Order number (integer).
          type: integer
        order_name:
          description: Order name, `#` followed by the order number.
          type: string
        buyer:
          $ref: '#/components/schemas/OrderBuyer'
          description: The buying customer's contact.
        line_items:
          description: Ordered items.
          type: array
          items:
            $ref: '#/components/schemas/LineItemV2'
        shipping_type:
          description: Shipping type code.
          type: string
        shipping_name:
          description: Shipping method name.
          type: string
        delivery_date:
          description: Requested delivery date.
          anyOf:
            - $ref: '#/components/schemas/Date'
            - type: "null"
        delivery_time:
          description: Requested delivery time slot (0 = any).
          type: integer
        delegate:
          description: Staff account that placed the order on the customer's behalf.
          type:
            - string
            - "null"
        prices:
          $ref: '#/components/schemas/OrderPrices'
          description: Price breakdown.
        transaction_number:
          description: Third-party payment transaction number.
          type:
            - string
            - "null"
        merchant_trade_no:
          description: Merchant trade number sent to the payment gateway.
          type: string
        statuses:
          $ref: '#/components/schemas/OrderStatuses'
          description: Status fields; see the enums.
        timings:
          $ref: '#/components/schemas/OrderTimings'
          description: Status timestamps.
        return_histories:
          description: Refund history.
          type: array
          items:
            type: string
        note:
          description: Note.
          type: string
        total_bonus_redemption_price:
          $ref: '#/components/schemas/Money'
          description: Total bonus points redeemed in the bonus mall.
        linked_order_info:
          description: Affiliate / linked-order attribution.
          type: object
          properties:
            source:
              description: Attribution source.
              type: string
        shipping_status:
          description: Carrier shipping status.
          type:
            - string
            - "null"
        extra_info:
          description: Extra information.
          type:
            - string
            - "null"
        from_device:
          description: Device the order was placed from.
          type: string
    AffiliateVendorOrder:
      type: object
      properties:
        status_code:
          description: Attribution status, e.g. `create_succeed`.
          type: string
        uid:
          description: The affiliate user id (`uid` query parameter of the storefront visit).
          type: string
        cid:
          description: The affiliate campaign id (`cid` query parameter of the storefront visit).
          type: string
        vendor_name:
          description: The affiliate vendor name.
          type: string
        order:
          $ref: '#/components/schemas/AffiliateOrder'
          description: The attributed order.
    Category:
      type: object
      properties:
        title:
          description: Title.
          type: string
        handle:
          description: URL handle.
          type: string
        full_handle:
          description: Full URL path including every parent handle, e.g. `clothing/mens/shirts`.
          type: string
        id:
          description: Id.
          type: integer
    CollectionProductV2:
      type: object
      properties:
        id:
          description: Id.
          type: integer
        title:
          description: Title.
          type: string
        position:
          description: Position (1-based).
          type: integer
    CustomCollectionV2:
      type: object
      properties:
        title:
          description: Title.
          type: string
        handle:
          description: URL handle.
          type: string
        published:
          description: Whether it is published.
          type: boolean
        body_html:
          description: HTML description.
          type:
            - string
            - "null"
        products_order_name:
          description: Display label of the product ordering used in the storefront.
