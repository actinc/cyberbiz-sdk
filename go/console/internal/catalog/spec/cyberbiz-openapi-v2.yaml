    CvsFulfillment:
      type: object
      properties:
        id:
          description: Id.
          type: integer
        tracking_company:
          description: Carrier code.
          type: string
        cvs_shipping_type:
          description: CVS shipping type, e.g. `family_c2c`; null when the order is not a CVS shipment.
          type: string
        tracking_number:
