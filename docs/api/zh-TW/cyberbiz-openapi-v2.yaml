openapi: 3.1.0
info:
  title: CYBERBIZ API v2 and app endpoints
  version: 1.0.1
  description: |-
    # CYBERBIZ API v2 與 app 端點

    CYBERBIZ 電商平台的 `/v2` 操作與無版本前綴的 app 端點（`/shop`、`/settings`）。v2 沒有機器可讀的規格；
    本文件由 CYBERBIZ Notion 參考頁面轉錄，並依據實際錄製的回應（Golden File）修正。
    v1 與 v2 共用主機、token 與下列慣例；v2 並非 v1 的替代品（訂單、商品、會員的 CRUD 仍在 v1）。

    ## 慣例

    - **Base URL**：所有商店與所有 API 版本皆為 `https://app-store-api.cyberbiz.io`。版本為路徑前綴（`/v1`、`/v2`）；app 端點 `/shop` 與 `/settings` 沒有前綴。
    - **驗證**：每個請求都帶 `Authorization: Bearer <API Token>`。token 是核發給 app、對應單一商店的 JWT，並攜帶其權限範圍（`read_orders`、`write_products` 等）。`read_*` 授權該資源群組的 GET 操作；`write_*` 授權 POST/PUT/DELETE。
    - **速率限制**：每個 token 每秒最多 5 個請求，超過會得到 `429`。
    - **分頁**：列表端點接受 `page`（從 1 起算）、`per_page`（預設與上限 50）與 `offset`；回傳的區段從第 `offset + (page - 1) * per_page + 1` 筆開始。回應帶有 `X-Page`、`X-Per-Page`、`X-Offset`、`X-Total`、`X-Total-Pages`、`X-Next-Page` 與 `X-Prev-Page`。
    - **時間**為 Asia/Taipei 當地時間字串 `YYYY-MM-DD HH:MM:SS`，不含時區（schema `Timestamp`）；日期為 `YYYY-MM-DD`（schema `Date`）。
    - **金額**欄位為 JSON 數字（如 `9999.0` 的浮點數），即使 swagger 標為 integer（schema `Money`）。
    - **Null**：沒有任何欄位保證非 null。實際回應中觀察到 `null` 的欄位已標為 nullable；其他欄位也應視為可能為 null。
    - **請求內容**以 JSON 送出。原始 swagger 將多數寫入操作記為 form data；平台接受 `application/json`。
    - **錯誤**格式為 `{"error": ["..."]}`、`{"error": "..."}`、`{"message": "..."}`、`{"messages": "..."}` 之一。`401` 代表 token 無效**或**商店未開通該功能。部分查詢找不到資料時回應 `200` 搭配 `null`，或 `206` 搭配 `[]`。
    - 本文件的**範例**皆為合成資料：結構來自實際錄製的回應，數值皆為虛構。

    ## Release Notes

    ### 1.0.1 (2026-10-02)

    - Postman collection 說明不再指向 repository 內部的檔案。

    ### 1.0.0 (2026-09-08)

    - 初版：由 CYBERBIZ v1 swagger、v1/v2 Postman collection、Notion v2 參考頁面與 webhook 參考文件產生。
    - 套用實際觀察的修正：可為 null 的欄位、金額為浮點數、order_number 為整數、文件記為物件的陣列、swagger 缺少的欄位、Bearer 驗證。
    - 每個操作與事件皆附有由 Golden File 衍生的合成範例。
servers:
  - url: https://app-store-api.cyberbiz.io
    description: 正式環境（所有商店與所有 API 版本共用同一主機）。
security:
  - bearerAuth: []
tags:
  - name: app
    description: 無版本前綴的 app 端點：商店本身與 app 在該商店的設定。
  - name: product_feeds
    description: 廣告平台用的商品 feed 網址。
  - name: affiliates
    description: 分潤廠商訂單。
  - name: pages
    description: 含自訂 HTML 區塊的前台自訂頁面。
  - name: shipping
    description: 超商與宅配託運單。
  - name: menus
    description: 前台選單（Linklist）。
  - name: categories
    description: 多層級商品分類。
  - name: collections
    description: 自訂群組與智慧群組（v2 搜尋端點）。
  - name: customer_oauth
    description: 會員 OAuth。
  - name: customers
    description: 會員：基本資料、標籤、自訂欄位、紅利點數、優惠券、訂單、VIP 資訊。
  - name: shop_emails
    description: 商店 email 與訂閱者。
  - name: products
    description: 商品、款式、選項、照片、介紹、標籤與綁定物流設定。
  - name: pos_wallets
    description: POS 儲值金（需開通 POS 儲值金功能）。
paths:
  /settings:
    get:
      tags:
        - app
      summary: 取得 app 在此商店的設定
      description: app 在此商店的安裝資訊（`shop_add_on`）：設定值、vendor type、token、有效期間，以及已安裝的 app 版本、manifest 與授予的權限範圍。
      operationId: getSettings
      responses:
        "200":
          description: app 安裝資訊。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopAddOnEnvelope'
              example:
                shop_add_on:
                  id: 1
                  settings: {}
                  vendor_type: example-app
                  token: synthetic-token-do-not-use
                  start_at: null
                  end_at: null
                  add_on_version:
                    webhook_url: https://example.com/webhooks/cyberbiz
                    manifest:
                      name: Example App
                      version: 0.1.0
                      scopes: public
                      manifest_version: 1
                      type: other
                      webhook_events:
                        - customers/create
                        - customers/update
                        - uid_providers/create
                        - uid_providers/update
                        - customer_tags/update
                        - bonus_points/create
                        - bonus_points/update
                        - bonus_points/destroy
                        - comment_bonus/create
                        - orders/opened
                        - orders/create
                        - orders/paid
                        - orders/preparing
                        - orders/fulfilled
                        - orders/received
                        - orders/arrived
                        - orders/expired
                        - orders/cancelled
                        - orders/returned
                        - orders/partial_return
                        - orders/refunded
                        - orders/partial_refunded
                        - orders/closed
                        - orders/request_return
                        - affiliate_vendor_orders/create
                        - affiliate_vendor_orders/closed
                        - affiliate_vendor_orders/cancelled
                        - orders/update
                        - products/create
                        - products/update
                        - products/delete
                        - products/update_photos
                        - products/update_options
                        - variants/create
                        - variants/update
                        - variants/delete
                        - cart/add
                        - domains/create
                        - domains/update
                        - domains/destroy
                        - collections/create
                        - collections/delete
                        - collections/update
                        - apps/uninstall
                        - express_delivery_orders/update
                        - bulk_operations/finish
                        - coupons/create
                        - coupons/update
                        - coupons/destroy
                        - customer_vip_level/update
                        - menus/create
                        - menus/update
                        - menus/destroy
                    embedded: true
                    status: init
                    scopes: public read_products write_products read_customers write_customers read_orders write_orders read_affiliates read_discounts write_discounts read_pos write_pos read_branch_stores write_branch_stores read_edms customer_notifications write_content read_content customer_oauth read_shop_points consume_shop_points read_eticket write_eticket refill_shop_points read_shop_emails pim read_shop_users
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - app
      summary: 更新 app 在此商店的設定
      description: 更新 app manifest 中宣告的 `setting_fields` 值。每個 `field` 必須與申請時宣告的欄位名稱相同。
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopAddOnSettingsUpdate'
            example:
              settings:
                - field: your_field_name
                  data: value
      responses:
        "200":
          description: 更新後的 app 安裝資訊。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopAddOnUpdatedEnvelope'
              example:
                shop_add_on:
                  id: 1
                  settings:
                    your_field_name: value
                  vendor_type: example-app
                  token: synthetic-token-do-not-use
                  start_at: null
                  end_at: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /shop:
    get:
      tags:
        - app
      summary: 取得商店資訊
      description: token 所屬的商店：主網域、名稱、id、聯絡 email、Open Graph 圖片與 LINE 設定。
      operationId: getShop
      responses:
        "200":
          description: 商店。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopInfoEnvelope'
              example:
                shop_info:
                  primary_domain: example.cyberbiz.co
                  name: 王小明
                  id: 1
                  email: customer@example.com
                  og_image_url: //example.cyberbiz.co/media/sample-product.jpg
                  shop_line_chat_bot: null
                  shop_line:
                    login_enable: true
                    liff_id: null
                    liff_enable: false
                  language: zh-TW
                  currency: TWD
                  sms_prefix: 【CYBERBIZ代發】
                  merchant_location: Taiwan
                  market_location: Taiwan
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/affiliate_vendor_orders:
    get:
      tags:
        - affiliates
      summary: 列出分潤廠商訂單
      description: |-
        歸屬於分潤廠商的訂單。以分潤參數（`affiliate`、`cid`、`uid`）建立的定期訂單，其子訂單也會包含在內。Notion 參考頁面顯示的是 `affiliate_vendor_orders` 封裝；實際 API 回應為裸陣列（Golden File），本文件以實際為準。

        權限範圍：`read_affiliates`。
      operationId: getV2AffiliateVendorOrders
      parameters:
        - name: start_time
          in: query
          description: 訂單建立起始時間（`YYYY-MM-DD hh:mm:ss`，Asia/Taipei）
          schema:
            type: string
          example: "2026-09-01 00:00:00"
        - name: end_time
          in: query
          description: 訂單建立結束時間（`YYYY-MM-DD hh:mm:ss`，Asia/Taipei）
          schema:
            type: string
          example: "2026-09-30 23:59:59"
        - name: closed_at_start_time
          in: query
          description: 訂單 `closed_at` 起始時間（`YYYY-MM-DD hh:mm:ss`，Asia/Taipei）
          schema:
            type: string
          example: "2026-09-01 00:00:00"
        - name: closed_at_end_time
          in: query
          description: 訂單 `closed_at` 結束時間（`YYYY-MM-DD hh:mm:ss`，Asia/Taipei）
          schema:
            type: string
          example: "2026-09-30 23:59:59"
        - name: statuses
          in: query
          description: 訂單狀態，多個以逗點分隔：`open`、`closed`、`cancelled`。
          schema:
            type: string
          example: open,closed
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: 分潤訂單。
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliateVendorOrder'
              example:
                - status_code: create_succeed
                  uid: U0000000000000000000000000000001
                  cid: 0123456789abcdef0123456789abcdef
                  vendor_name: example-vendor
                  order:
                    customer_id: 1
                    subtotal_price: 300.0
                    created_at: "2026-09-01 10:00:00"
                    updated_at: "2026-09-01 10:00:00"
                    order_number: 1001
                    order_name: '#1001'
                    buyer:
                      email: customer@example.com
                      mobile: "0912345678"
                    line_items:
                      - id: 2
                        product_id: 3
                        product_variant_id: 4
                        title: 範例商品
                        variant_title: ""
                        sku: SKU-001
                        qc: null
                        vendor: null
                        price: 300.0
                        cost: null
                        quantity: 1
                        item_type: normal
                        discount_name: ""
                        discounts: []
                        total_price_before_discounts: 300.0
                        total_discount: 0.0
                        total_price_after_discounts: 300.0
                        tax_type_id: inclusive_tax
                        bonus_redemption_price: null
                        related_items: []
                        created_at: "2026-09-01 10:00:00"
                    shipping_type: cyberbiz
                    shipping_name: 自取
                    delivery_date: null
                    delivery_time: 0
                    delegate: null
                    prices:
                      total_line_items_price: 300.0
                      shipping_rate_price: 10.0
                      discounts:
                        special_collection_discount: 0.0
                        vip_discount: 0.0
                        shop_discount: null
                        coupon_discount: null
                        coupon_discounts: []
                        bonus_consumed: 0.0
                        vip_shipping_discount: 0.0
                        coupon_shipping_discount: 0.0
                        price_discount: 0.0
                      total_price: 310.0
                    transaction_number: null
                    merchant_trade_no: S1#1001
                    statuses:
                      order_status: open
                      financial_status: pending
                      fulfillment_status: unshipped
                      return_status: no_need
                    timings:
                      request_return_at: null
                      return_at: null
                      refund_at: null
                      closed_at: null
                      cancelled_at: null
                      expired_at: null
                      confirmed_at: "2026-09-01 10:00:00"
                    return_histories: []
                    note: ""
                    total_bonus_redemption_price: 0.0
                    linked_order_info:
                      source: 非導購訂單
                    shipping_status: null
                    extra_info: null
                    from_device: 桌機
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/categories:
    get:
      tags:
        - categories
      summary: 列出分類
      description: |-
        多層級商品分類。`full_handle` 編碼了階層（`clothing/mens/shirts`），並組成前台網址 `https://<domain>/categories/<full_handle>`；`handle` 只是該分類自己的片段。

        權限範圍：`read_products`。
      operationId: getV2Categories
      parameters:
        - name: q
          in: query
          description: 要搜尋的分類標題（字串比對）。
          schema:
            type: string
          example: 服飾
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: 分類列表。
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - title: 範例群組
                  handle: ecoupon
                  full_handle: ecoupon
                  id: 1
                - title: 範例群組
                  handle: entea
                  full_handle: entea
                  id: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/custom_collections:
    get:
      tags:
        - collections
      summary: 搜尋自訂群組
      description: |-
        自訂群組，可依標題或 handle 搜尋。`products_order_name` 帶的是排序方式的顯示文字（如 `按標題拼音升序: A-Z`）而非代碼；代碼為 `title.asc`、`title.desc`、`created_at.desc`、`created_at.asc`、`price.desc`、`price.asc`、`manual`、`sell_weight.desc`。

        權限範圍：`read_products`。
      operationId: getV2CustomCollections
      parameters:
        - name: q
          in: query
          description: 要搜尋的標題或 handle（字串比對）。
          schema:
            type: string
          example: 首頁
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        "200":
          description: 群組列表。
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomCollectionV2'
              example:
                - title: 範例群組
                  handle: 英茶香
                  published: true
                  body_html: null
                  products_order_name: '按標題拼音升序: A-Z'
                  position: 2
                  id: 1
                - title: 範例群組
                  handle: 所有商品
                  published: true
                  body_html: null
                  products_order_name: '按標題拼音升序: A-Z'
                  position: 1
                  id: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/customer_oauth:
    post:
      tags:
        - customer_oauth
      summary: 會員 OAuth
      description: |-
        文件缺陷：此端點在 Notion 的段落完全複製自 `GET /v2/categories`，因此沒有公開的請求／回應規格。下方請求內容來自 CYBERBIZ Postman collection；回應未有文件。使用前請先洽 CYBERBIZ 客服。

        權限範圍：`customer_oauth`。
      operationId: postV2CustomerOauth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOAuthRequest'
            example:
              uid: U0000000000000000000000000000001
              provider: line
      responses:
        "200":
          description: 未有文件說明。
          content:
            application/json:
              schema:
                description: Undocumented response body.
              example: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/customers:
    get:
      tags:
        - customers
      summary: 列出會員
      description: |-
        會員裸陣列。實際 API 回傳範例所示的精簡結構；`include_params` 可加入選用區段（文件記載 `vip_info`；Postman collection 也送 `uid_providers,tags`）。指定 `ids` 時分頁功能失效。

        權限範圍：`read_customers`。
      operationId: getV2Customers
      parameters:
        - name: ids
          in: query
          description: 以逗點分隔的會員 id（最多 100 個）。會停用分頁。
          schema:
            type: string
          example: 1,2,3
        - name: include_params
          in: query
          description: 要包含的額外區段，以逗點分隔。文件記載：`vip_info`。
          schema:
            type: string
          example: vip_info
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/offset'
      responses:
        "200":
          description: 會員列表。
          headers:
            X-Page:
              $ref: '#/components/headers/X-Page'
            X-Per-Page:
              $ref: '#/components/headers/X-Per-Page'
            X-Offset:
              $ref: '#/components/headers/X-Offset'
            X-Total:
              $ref: '#/components/headers/X-Total'
            X-Total-Pages:
              $ref: '#/components/headers/X-Total-Pages'
            X-Next-Page:
              $ref: '#/components/headers/X-Next-Page'
            X-Prev-Page:
              $ref: '#/components/headers/X-Prev-Page'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerV2'
              example:
                - id: 1
                  name: 王小明
                  status: enabled
                  email: customer@example.com
