                      title: 範例標題
                      position: 1
                    - id: 2
                      title: 範例標題
                      position: 2
                  id: 1
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '商店的 API Token，以 `Authorization: Bearer <token>` 送出。一個 token 對應一個商店，並攜帶 app 被授予的權限範圍。'
  parameters:
    page:
      name: page
      in: query
      description: 頁碼，從 1 起算。
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1
    per_page:
      name: per_page
      in: query
      description: Records per page; default and maximum 50.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 50
      example: 50
    offset:
      name: offset
      in: query
      description: 分頁前略過的筆數。回傳的第一筆為第 `offset + (page - 1) * per_page + 1` 筆。
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0
  headers:
    X-Page:
      description: 回傳的頁碼（同請求的 `page`）。
      schema:
        type: string
      example: "1"
    X-Per-Page:
      description: 每頁筆數（同請求的 `per_page`）。
      schema:
        type: string
      example: "50"
    X-Offset:
      description: 分頁前略過的筆數（同請求的 `offset`）。
      schema:
        type: string
      example: ""
    X-Total:
      description: 符合查詢的總筆數，與分頁無關。
      schema:
        type: string
      example: "92"
    X-Total-Pages:
      description: 總頁數：CEILING((X-Total - X-Offset) / X-Per-Page)。
      schema:
        type: string
      example: "2"
    X-Next-Page:
      description: 下一頁頁碼；最大為 X-Total-Pages。最後一頁時為空。
      schema:
        type: string
      example: "2"
    X-Prev-Page:
      description: 上一頁頁碼；第一頁時為空。
      schema:
        type: string
      example: ""
  responses:
    Unauthorized:
      description: token 缺少、無效、過期、缺少權限範圍，或商店未開通該功能（CYBERBIZ 對兩者都回 401）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              $ref: '#/components/examples/unauthorized'
    Forbidden:
      description: '資源目前的狀態不允許此操作，或缺少必要的 plugin。body 為 `{"error": "..."}` 或 `{"messages": "..."}`。'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              $ref: '#/components/examples/forbidden'
    NotFound:
      description: 資源不存在。注意部分查詢會回 `200` 搭配 `null`，或 `206` 搭配 `[]`，而非 `404`。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/notFound'
    UnprocessableEntity:
      description: '驗證失敗，或商店未啟用該功能。body 為 `{"error": [...]}` 或 `{"message": "..."}`。'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unprocessableEntity:
              $ref: '#/components/examples/unprocessableEntity'
    TooManyRequests:
      description: 每秒送出超過 5 個請求。請退避後重試；body 格式未有文件說明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooManyRequests:
              $ref: '#/components/examples/tooManyRequests'
  examples:
    unauthorized:
      summary: 未授權
      value:
        error:
          - 無權使用該 API
    forbidden:
      summary: 禁止
      value:
        error: Must have pos_shop_coupon plugin
    notFound:
      summary: 找不到資源
      value:
        error:
          - 無此資源
    unprocessableEntity:
      summary: 無法處理
      value:
        error:
          - custom_field_type 無效值
    tooManyRequests:
      summary: 請求過多
      value:
        error:
          - Rate limit exceeded
