    Timestamp:
      description: Asia/Taipei 當地時間，寫作 `YYYY-MM-DD HH:MM:SS`，不含時區（v2 端點偶爾為 `YYYY-MM-DD HH:MM:SS +0800` 或 `YYYY-MM-DD HH:MM+0800`）。請以 Asia/Taipei 解析，絕不可當作 UTC。
      type: string
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?( ?\+0800)?$
      examples:
        - "2026-09-01 10:00:00"
