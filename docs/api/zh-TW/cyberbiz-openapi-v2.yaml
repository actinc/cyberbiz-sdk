          type: string
          enum:
            - default
            - company
            - phone_barcode
            - nature_person
            - donate
            - paper_invoice
        love_code:
          description: 捐贈碼。
          type: string
        phone_barcode:
          description: 手機條碼載具。
          type: string
        nature_person:
          description: 自然人憑證載具。
          type: string
    WalletTransaction:
      type: object
      properties:
        type:
          description: 交易類型：`topup`（儲值）、`consumption`（消費）、`refund`（退儲值金）、`cancel_order`（訂單取消退還）、`bonus`。
          type: string
          enum:
            - topup
            - consumption
            - refund
            - cancel_order
            - bonus
        amount:
          $ref: '#/components/schemas/Money'
          description: 金額；正數為餘額增加（儲值、訂單取消），負數為減少（消費、退儲值金）。
        balance_after:
          $ref: '#/components/schemas/Money'
          description: 交易後餘額。
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: 建立時間。
        payment_name:
          description: 付款方式名稱（例如 `現金`）；僅 `topup` 與 `refund` 有。
          type:
            - string
            - "null"
        invalid_einvoices:
          description: 作廢的發票（僅 `refund`）。
          type: array
          items:
            $ref: '#/components/schemas/WalletEinvoice'
        allowance_einvoices:
          description: 折讓發票（僅 `refund`）。
          type: array
          items:
            $ref: '#/components/schemas/WalletEinvoice'
        financial_status:
          description: 儲值付款狀態：`paid`（已付款）、`failed`（付款失敗）、`timeout`（處理中）、`pending`（待付款）。
          type: string
          enum:
            - paid
            - failed
            - timeout
            - pending
        einvoice:
          $ref: '#/components/schemas/WalletEinvoice'
          description: 儲值的發票（僅 `topup`）。
        paper_invoice_no:
          description: '`invoice_type` 為 `paper_invoice` 時的紙本發票號碼。'
          type:
            - string
            - "null"
