          description: 付款狀態：`paid`（已收到款項）、`pending`（等待付款）、`cod`（貨到付款）、`failed`（付款失敗）、`abandoned`（顧客棄單）、`refunded`（已退款）、`no_refunded`（不退款）、`pending_refund`（待退款）、`processing`（客服處理中）、`remitted`（已回填帳號未收款）、`pending_partial_refund`（待部分退款）、`partial_refunded`（部分退款）、`refunding`（退款中）、`refund_failed`（退款失敗）。篩選用的 `except_abandoned_order` 與 `all_financial_status` 只是查詢輔助值，不是狀態。
