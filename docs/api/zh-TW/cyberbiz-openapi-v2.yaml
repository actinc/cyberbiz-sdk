  /v2/products/batch_update_branch_store_inventory:
    put:
      tags:
        - products
      summary: 批量更新門市庫存
      description: |-
        排入非同步工作，依店號與 SKU 設定門市庫存；每次最多 1000 筆。需要「利用店號和 sku 批量更新門市庫存」功能（否則回 `422`）。以 `GET /v2/products/branch_store_inventory_update_status` 輪詢工作狀態。

        權限範圍：`write_products`。
      operationId: putV2ProductsBatchUpdateBranchStoreInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryBatchUpdate'
            example:
              store_number: S001
              items:
                - sku: SKU-001
                  inventory_quantity: 10
                - sku: SKU-002
                  inventory_quantity: 5
      responses:
        "202":
          description: 已排入的工作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryJobQueued'
              example:
                job_id: 5f1a2b3c4d5e6f7a8b9c0d1e
                status: QUEUED
                message: Inventory update job has been queued
                store_number: S001
                total_items: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v2/products/branch_store_inventory_update_status:
    get:
      tags:
        - products
      summary: 查詢批量庫存工作
      description: |-
        由 `PUT /v2/products/batch_update_branch_store_inventory` 建立的工作狀態。`status` 為 `QUEUE`（查詢）／`QUEUED`（建立）、`PROCESSING`、`SUCCESS` 或 `FAILED`；不存在的工作回 `{"error": ["job_id '...' 不存在"]}`。此處的時間帶有 `+0800` 後綴。

        權限範圍：`read_products`。
      operationId: getV2ProductsBranchStoreInventoryUpdateStatus
      parameters:
        - name: job_id
          in: query
